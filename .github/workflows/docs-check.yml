name: Docs Validation

on:
  push:
    branches:
      - main
      - 'docs/**'
    paths:
      - 'docs/**'
  pull_request:
    paths:
      - 'docs/**'

jobs:
  docs-validation:
    name: Validate Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Front-matter
        id: frontmatter
        continue-on-error: false
        run: |
          echo "::group::Front-matter Validation"
          npm run docs:verify-frontmatter
          echo "::endgroup::"

      - name: Check Markdown format
        id: markdown-lint
        continue-on-error: false
        run: |
          echo "::group::Markdown Linting"
          npm run docs:lint
          echo "::endgroup::"

      - name: Validate links
        id: link-check
        continue-on-error: false
        run: |
          echo "::group::Link Validation"
          npm run docs:links
          echo "::endgroup::"

      - name: Summary
        if: always()
        run: |
          echo "### Docs Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Front-matter | ${{ steps.frontmatter.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Markdown Lint | ${{ steps.markdown-lint.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Link Check | ${{ steps.link-check.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Strict Mode Active**: All validation checks must pass" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📝 **Status**:" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 5 complete: All 24 files have valid Front-matter" >> $GITHUB_STEP_SUMMARY
          echo "- Strict mode enabled: Validation failures will block merges" >> $GITHUB_STEP_SUMMARY
